spring:
  application:
    name: indexer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/docmind
    username: docmind
    password: docmind
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: indexer-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.docmind.indexer.DocumentCreatedEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.docmind.indexer
server:
  port: 8082
docmind:
  embedder: djl
  topics:
    document-created: docmind.document-created
