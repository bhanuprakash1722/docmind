name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Build Docker images
        run: |
          docker build -f api-service/Dockerfile -t docmind-api:ci .
          docker build -f indexer-service/Dockerfile -t docmind-indexer:ci .
